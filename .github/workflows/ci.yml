name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  rust:
    name: Rust build / test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Tauri's Linux stack links against system GTK/WebKit; the repo
      # additionally needs gtk-layer-shell (palette overlay) and D-Bus
      # headers (keyring/Secret Service).
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libgtk-layer-shell-dev \
            libdbus-1-dev
      - run: bun install
      - name: Build Tauri backend
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
