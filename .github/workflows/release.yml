name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every run advances the patch number. Change this when beginning a new
  # major/minor release line; the first run of this workflow is 1.0.0.
  RELEASE_SERIES: '1.0'

jobs:
  release-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose release version
        id: version
        shell: bash
        run: |
          patch=$((GITHUB_RUN_NUMBER - 1))
          version="${RELEASE_SERIES}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building Commandeer ${version}"

  quality:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-layer-shell-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      - name: Lint backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check agent configuration
        run: node .agents/hooks/check-agent-sync.mjs

  prepare-release:
    needs: [release-version, quality]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: node .github/scripts/atomic-release.mjs prepare

  build-release-assets:
    needs: [release-version, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-layer-shell-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload draft assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # tauri.cjs is the single version resolver for local and CI builds.
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          # linuxdeploy's bundled strip is older than some modern ELF
          # formats. Skipping that optional size pass keeps AppImage builds
          # portable across runner/toolchain updates.
          NO_STRIP: '1'
        with:
          tauriScript: bun tauri
          # Keep the version visible to tauri-action as well as tauri.cjs so
          # artifact discovery uses the same filenames that the CLI produces.
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config '{"version":"${{ needs.release-version.outputs.version }}"}'
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: commandeer-[version]-[platform]-[arch][setup][ext]

  finalize-release:
    needs: [release-version, prepare-release, build-release-assets]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: node .github/scripts/atomic-release.mjs finalize
