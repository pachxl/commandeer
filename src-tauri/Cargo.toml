[package]
name = "commandeer"
version = "0.1.0"
edition = "2021"

[lib]
name = "commandeer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# Parallel directory walker for the folder file-search (much faster than
# walkdir on large trees)
jwalk = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[target.'cfg(not(windows))'.dependencies]
# Render the palette as a wlr-layer-shell surface on Linux/Wayland: lets the
# compositor center it and makes transparent regions truly invisible (no
# toplevel border/tint), and allows in-place resize without an unmap flash.
gtk = "0.18"
# v0_6 enables set_keyboard_mode (KeyboardMode::OnDemand); our system lib is 0.10.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
