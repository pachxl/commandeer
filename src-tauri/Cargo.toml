[package]
name = "commandeer"
version = "0.1.0"
edition = "2021"

[lib]
name = "commandeer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# Parallel per-level directory reads for the folder file-search
rayon = "1"
tokio = { version = "1", features = ["full"] }
# Live filesystem watcher feeding the self-hosted file index
notify = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Self-hosted file index: SQLite + FTS5 (trigram tokenizer)
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
arboard = "3"
# Screenshot tool: crop the frozen frame + PNG encode/decode
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# kill(2) for the process-list "kill" action
libc = "0.2"
# Clipboard-history encryption at rest (Windows uses DPAPI; Linux stores the
# key in the Secret Service via `keyring`, falling back to a 0600 key file)
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(not(windows))'.dependencies]
# Render the palette as a wlr-layer-shell surface on Linux/Wayland: lets the
# compositor center it and makes transparent regions truly invisible (no
# toplevel border/tint), and allows in-place resize without an unmap flash.
gtk = "0.18"
# v0_6 enables set_keyboard_mode (KeyboardMode::OnDemand); our system lib is 0.10.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
